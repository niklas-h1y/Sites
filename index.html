<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Choose a site</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 48px 20px; display: grid; place-items: center; color: #eef2ff; background: radial-gradient(ellipse at 15% 10%, #263a5c 0, transparent 42%), linear-gradient(145deg, #0b1220, #111c30 60%, #17243a); }
    main { width: min(100%, 680px); }
    .eyebrow { margin: 0 0 12px; color: #9fb4d8; font-size: .76rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.4rem); letter-spacing: -.045em; }
    .intro { margin: 12px 0 30px; color: #b8c5da; line-height: 1.6; }
    #status { min-height: 24px; margin: 0 0 12px; color: #a9bad3; font-size: .9rem; }
    #sites { display: grid; gap: 12px; }
    .site { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 19px 21px; border: 1px solid #34445e; border-radius: 16px; color: inherit; text-decoration: none; background: #17243a; box-shadow: 0 8px 24px #0002; transition: transform .18s ease, border-color .18s ease, background .18s ease; }
    .site:hover, .site:focus-visible { transform: translateY(-2px); border-color: #8bb5ff; background: #1d304d; outline: none; }
    .site-name { font-weight: 650; font-size: 1.05rem; }
    .site-file { display: block; margin-top: 5px; color: #9fb0ca; font-size: .82rem; font-weight: 400; }
    .arrow { color: #a9c8ff; font-size: 1.4rem; }
    .message { padding: 20px; border: 1px dashed #435571; border-radius: 14px; color: #b8c5da; line-height: 1.6; }
    footer { margin-top: 26px; color: #8193ae; font-size: .8rem; text-align: center; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Your collection</p>
    <h1>Choose a site</h1>
    <p class="intro">Select one of the available pages below to open it.</p>
    <p id="status" role="status" aria-live="polite">Loading your pages…</p>
    <nav id="sites" aria-label="Available sites"></nav>
    <footer>Pages in this collection</footer>
  </main>
  <script>
    (() => {
      const owner = "niklas-h1y";
      const repo = "Sites";
      const branch = "main";
      const status = document.getElementById("status");
      const list = document.getElementById("sites");

      Promise.all([
        fetch(`https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`, {
          headers: { Accept: "application/vnd.github+json" }
        }).then(response => {
          if (!response.ok) throw new Error("The page list could not be loaded.");
          return response.json();
        }),
        fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${branch}/categories.txt`)
          .then(response => response.ok ? response.text() : "")
          .catch(() => "")
      ])
        .then(([files, categoryText]) => {
          // Line format: 1: Category name |  (1 maps to index2.html)
          const categoryNames = new Map();
          for (const line of categoryText.split(/\r?\n/)) {
            const match = line.match(/^\s*(\d+)\s*:\s*(.*?)\s*\|\s*$/);
            if (match && match[2]) categoryNames.set(Number(match[1]) + 1, match[2]);
          }

          const pages = files
            .filter(file => file.type === "file" && /^index[2-9][0-9]*\.html$/i.test(file.name))
            .sort((a, b) => Number(a.name.match(/^index(\d+)/i)[1]) - Number(b.name.match(/^index(\d+)/i)[1]));

          status.textContent = pages.length
            ? `Choose from ${pages.length} available page${pages.length === 1 ? "" : "s"}.`
            : "No additional pages have been added yet.";

          if (!pages.length) {
            const empty = document.createElement("div");
            empty.className = "message";
            empty.textContent = "When index2.html, index3.html, and other numbered pages are added to the repository root, they will appear here automatically.";
            list.appendChild(empty);
            return;
          }

          for (const page of pages) {
            const pageNumber = Number(page.name.match(/^index(\d+)/i)[1]);
            const link = document.createElement("a");
            link.className = "site";
            link.href = page.name;
            const label = document.createElement("span");
            label.className = "site-name";
            label.textContent = categoryNames.get(pageNumber) || `Category ${pageNumber - 1}`;
            const filename = document.createElement("span");
            filename.className = "site-file";
            filename.textContent = page.name;
            label.appendChild(filename);
            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.setAttribute("aria-hidden", "true");
            arrow.textContent = "→";
            link.append(label, arrow);
            list.appendChild(link);
          }
        })
        .catch(() => {
          status.textContent = "Could not load the page list.";
          const error = document.createElement("div");
          error.className = "message";
          error.textContent = "Please refresh the page and try again. The repository's public file listing must be accessible through the GitHub API.";
          list.appendChild(error);
        });
    })();
  </script>
</body>
</html>
